<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKOUT</title>
    <link rel="stylesheet" href="Checkout.css">
</head>
<body>
    <!-- CHECKOUT -->
  <section id="Checkout" class="checkout-section">

    <h2 id="h2"> CHECKOUT</h2>
    <p>Review your order and complete your purchase</p>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name"required>

      <label>Email</label>
      <input type="Email" placeholder="Enter your email"required>

      <label>Address</label>
      <input type="text" placeholder="enter your adress"required>

      <label>Contact</label>
      <input type="number" placeholder="enter your contact number"required>

      <!-- PAYMENT METHOD -->

      <h3>Payment Method</h3>

      <label class="payment-option">
        <input type="radio" name="payment" value="cod"required>Cash on Delivery
      </label>

      <label class="payment-option">
        <input type="radio" name="payment" value="cod"required>Gcash
      </label>

      <label class="payment-option">
        <input type="radio" name="payment" value="cod"required>Bank Transfer
    </label>

      <button type="submit">Place order</button>
    </form>
  </section>

   <!-- FOOTER -->
        <footer>

            </p>

            </p>

        </footer>

    </div>

    
</body>
</html>
